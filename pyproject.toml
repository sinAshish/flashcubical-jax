[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "flash-cubical"
version = "0.1.0"
description = "Fast cubical persistent homology for 2D and 3D scalar grids"
requires-python = ">=3.9"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
gpu = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "torch>=2.1.0",
]
test = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/flash_cubical"]

[dependency-groups]
dev = [
    "build>=1.4.4",
]
